[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "x3mf"
version = "0.1.0"
description = "Translate slicer 3MF projects between dialects, carrying plates, parts, filaments, colours, layer ranges and process settings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["3mf", "3d-printing", "orcaslicer", "bambu-studio", "slicer", "translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Utilities",
]

[project.scripts]
x3mf = "x3mf.cli:main"

[project.urls]
Homepage = "https://github.com/axsddlr/x3mf"
Issues = "https://github.com/axsddlr/x3mf/issues"

[tool.setuptools]
packages = ["x3mf"]
include-package-data = true

[tool.setuptools.package-data]
# The web interface is plain files served from the package; a wheel without
# them installs a CLI whose `web` subcommand cannot start.
x3mf = ["webui/*"]
