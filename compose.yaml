# Hardened default deployment for the web interface.
#
#   docker compose up --build        http://127.0.0.1:8791/
#
# The container runs with a read-only root filesystem, no Linux capabilities and
# no privilege escalation; the only writable paths are the /data volume and a
# 64 MB tmpfs mounted at /tmp.

services:
  x3mf:
    build:
      context: .
      dockerfile: Dockerfile
    image: x3mf:0.1.0
    container_name: x3mf
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - x3mf-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A 256 MB upload is held in memory while it is parsed; leave headroom.
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8791/api/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  x3mf-data:
